<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'"><title>선택 그래픽 체험</title><style>body{margin:0;background:#171c32;color:#fff;font:12px/1.6 sans-serif}canvas{display:block;width:100%;height:300px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px}button{background:#eeeaff;color:#403866;border:0;padding:9px 14px;border-radius:7px;cursor:pointer}label{display:flex;gap:5px;align-items:center}input{width:80px}#status{padding:0 12px;color:#c6bedb}button:focus-visible,input:focus-visible{outline:3px solid #e9ce73}</style></head><body><header><button id="toggle">움직임 시작</button><button id="reset">초기화</button><label>속도<input id="speed" type="range" min="1" max="5" value="2"></label><label>밀도<input id="density" type="range" min="30" max="240" value="120"></label></header><p id="status" role="status">웹 Canvas 선택 체험 · 시작 버튼을 누르면 움직입니다.</p><canvas id="canvas" width="720" height="300" aria-label="그래픽 작품 관찰 화면"></canvas><script src="./gallery.js"></script></body></html>

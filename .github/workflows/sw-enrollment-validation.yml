name: SW student enrollment validation
on:
  push:
    branches: [work/sw-enrollment-20261109]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sw-enrollment-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix sw
      - name: Enrollment and existing storage contracts
        run: node --test sw/tests/enrollment.test.mjs sw/tests/store.test.mjs
      - name: Existing shared rules regression (unchanged baseline)
        run: SW_RULES_FILE=sw/security/integration-proposed.rules npx firebase emulators:exec --config sw/firebase.integration.json --project demo-englishmath-python --only firestore 'node --test --test-concurrency=1 sw/tests/student-security.test.mjs sw/tests/grade1-isolation.test.mjs'
      - name: Build SW candidate only
        run: |
          npm run build:sw
          python3 sw/publisher/package_site.py dist --source-sha "$GITHUB_SHA"
          python3 sw/publisher/finalize_brand.py --dist dist --source-sha "$GITHUB_SHA"
          python3 sw/publisher/check_site.py dist
      - run: npx playwright install chromium
      - name: Proposed enrollment security and browser verification (emulators only)
        run: npx firebase emulators:exec --config sw/firebase.enrollment.json --project demo-englishmath-python --only auth,firestore 'SW_ENROLLMENT=1 SW_RULES_FILE=sw/security/enrollment-proposed.rules node --test --test-concurrency=1 sw/tests/student-security.test.mjs sw/tests/grade1-isolation.test.mjs sw/tests/integration-security.test.mjs sw/tests/enrollment-security.test.mjs && node sw/tests/enrollment-browser.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-enrollment-evidence
          path: sw/evidence/enrollment-20261109/
      - uses: actions/upload-artifact@v4
        with:
          name: sw-enrollment-site-candidate
          path: dist/
          retention-days: 14

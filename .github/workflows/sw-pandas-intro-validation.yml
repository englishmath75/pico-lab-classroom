name: SW pandas introduction validation
on:
  push:
    branches: [work/pandas-first-lesson-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3
      - run: python scripts/pandas-intro/verify.py
      - run: npm ci && npm ci --prefix sw
      - run: node --test sw/tests/store.test.mjs sw/tests/membership.test.mjs sw/tests/enrollment.test.mjs
      - name: Build complete SW candidate
        env:
          SW_SOURCE_SHA: ${{ github.sha }}
        run: |
          npm run build:sw
          python3 sw/publisher/package_site.py dist --source-sha "$GITHUB_SHA"
          python3 sw/publisher/finalize_brand.py --dist dist --source-sha "$GITHUB_SHA"
          python3 sw/publisher/check_site.py dist
          node --test sw/tests/content.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pandas-intro/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-pandas-intro-evidence
          path: sw/evidence/pandas-intro/

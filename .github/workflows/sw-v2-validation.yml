name: SW V2 isolated validation
on:
  push:
    branches: [work/sw-v2-unified-20261106]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sw-v2-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Storage and route contracts
        run: node --test sw/tests/store.test.mjs
      - name: Shared rules regression in emulator only
        run: npx firebase emulators:exec --config sw/firebase.test.json --project demo-englishmath-python --only firestore 'node --test --test-concurrency=1 sw/tests/student-security.test.mjs sw/tests/grade1-isolation.test.mjs'
      - name: Existing SW baseline build
        run: npm run build -- --base=/sw/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sw-v2-validation-evidence
          path: |
            sw/evidence/
            firestore-debug.log
          if-no-files-found: ignore

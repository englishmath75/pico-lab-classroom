name: PICO LAB 배포

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: 학생용 교재 준비
        run: |
          mkdir -p public/downloads
          base64 --decode public/downloads/arduino-foundations.docx.b64 > public/downloads/arduino-foundations.docx

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 패키지 설치
        run: npm ci

      - name: 웹앱 빌드
        run: npm run build

      - name: GitHub Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 배포 파일 준비
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4

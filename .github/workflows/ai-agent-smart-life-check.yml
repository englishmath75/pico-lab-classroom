name: AI Agent Smart Life 검증

on:
  push:
    branches:
      - feature/ai-agent-smart-life-plan
    paths:
      - "public/ai-agent-smart-life/**"
      - "docs/ai-agent-smart-life/**"
      - ".github/workflows/ai-agent-smart-life-check.yml"
  pull_request:
    paths:
      - "public/ai-agent-smart-life/**"
      - "docs/ai-agent-smart-life/**"
      - ".github/workflows/ai-agent-smart-life-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify JS source syntax
        run: |
          node --check public/ai-agent-smart-life/lessons.js
          node --check public/ai-agent-smart-life/app.js
          node --check public/ai-agent-smart-life/enrichment.js
          node --check public/ai-agent-smart-life/teacher.js
          node --check public/ai-agent-smart-life/exam.js
          node --check public/ai-agent-smart-life/test/smoke.cjs
          python -m py_compile public/ai-agent-smart-life/project/study_agent.py
          python public/ai-agent-smart-life/project/study_agent.py public/ai-agent-smart-life/project/study_scores.csv
      - name: Validate 12 lesson contents and quizzes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const window = {};
          vm.runInNewContext(fs.readFileSync('public/ai-agent-smart-life/lessons.js','utf8'), {window});
          vm.runInNewContext(fs.readFileSync('public/ai-agent-smart-life/enrichment.js','utf8'), {window});
          const lessons = window.AASL_LESSONS;
          const deepDives = window.AASL_DEEP_DIVE;
          assert.equal(deepDives.length, 12, 'all enrichment lessons present');
          assert.equal(lessons.length, 12);
          lessons.forEach((l, i) => {
            for (const key of ['title','tag','goal','concept','example','code','expect','task'])
              assert.ok(typeof l[key] === 'string' && l[key].trim(), 'Lesson '+(i+1)+': '+key);
            assert.ok(l.questions.length >= 2, 'Lesson '+(i+1)+' quizzes');
            assert.equal(deepDives[i].extraQuestions.length, 3,'Lesson '+(i+1)+' enrichment quiz count');
            l.questions.forEach((q,j) => {
              assert.equal(q.length,4,'Question fields');
              assert.ok(q[1].length >= 2);
              assert.ok(Number.isInteger(q[2]) && q[2]>=0 && q[2]<q[1].length);
            });
          });
          const html=fs.readFileSync('public/ai-agent-smart-life/index.html','utf8');
          assert.ok(html.includes('src="./lessons.js"') && html.includes('src="./enrichment.js"') && html.includes('src="./app.js"'));
          assert.ok(html.includes('href="./teacher.html"') && html.includes('href="./exam.html"'));
          console.log('Validated '+lessons.length+' lessons and '+lessons.reduce((x,l,i)=>x+l.questions.length+deepDives[i].extraQuestions.length,0)+' questions.');
          NODE
      - name: Prepare existing PICO LAB public assets
        run: |
          mkdir -p public/downloads
          base64 --decode public/downloads/arduino-foundations.docx.b64 > public/downloads/arduino-foundations.docx
      - name: Install dependencies
        run: npm ci
      - name: Build existing app plus new classroom
        run: npm run build
      - name: Verify new classroom is included in build
        run: |
          test -s dist/ai-agent-smart-life/index.html
          test -s dist/ai-agent-smart-life/lessons.js
          test -s dist/ai-agent-smart-life/app.js
          test -s dist/ai-agent-smart-life/enrichment.js
          test -s dist/ai-agent-smart-life/teacher.html
          test -s dist/ai-agent-smart-life/teacher.js
          test -s dist/ai-agent-smart-life/exam.html
          test -s dist/ai-agent-smart-life/exam.js
          test -s dist/ai-agent-smart-life/project/study_agent.py
          test -s dist/ai-agent-smart-life/project/study_scores.csv
          echo "Static AI classroom assets are packaged in dist/"
      - name: Install Chromium smoke-test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real-browser functional smoke test
        run: node public/ai-agent-smart-life/test/smoke.cjs

name: MK membership stable mobile evidence
on:
  push:
    branches: [work/mk-membership-evidence-20261109]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:mk
      - name: Stable mobile membership views and full membership flow
        env:
          MK_RULES_FILE: mk/security/membership-proposed.rules
          MK_TEST_SCENARIO: 'membership:'
          MK_TEST_ARTIFACTS: .artifacts/mk-membership
        run: npx firebase emulators:exec --project demo-englishmath-python --only auth,firestore 'node tests/mk-unified-browser.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mk-membership-stable-evidence
          path: .artifacts
          include-hidden-files: true

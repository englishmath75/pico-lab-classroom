name: Assessment navigation browser check

on:
  workflow_run:
    workflows: ["PICO LAB 배포"]
    types: [completed]
    branches: [main]
  push:
    branches: [fix/assessment-nav-five-links-20261017]
    paths:
      - ".github/workflows/assessment-navigation-browser.yml"
      - "app/arduino-assessment.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assessment-navigation-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the relevant source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps --only-shell chromium
      - name: Verify five published navigation links on desktop and mobile
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright, expect
          
          base = "https://englishmath75.github.io/pico-lab-classroom/"
          sha = os.environ["CHECKED_SHA"]
          url = base + "?view=assessment&qa=5&v=" + sha[:12]
          expected = [
              "① 연습 문제지 보기",
              "② 실습 영상 3편",
              "③ Tinkercad 3단계",
              "④ 빈칸 코드 받기",
              "⑤ 연습 정답·해설",
          ]
          expected_hrefs = [
              base + "a29/materials/exam-one-page.html",
              "#videos",
              base + "a29/index.html",
              base + "downloads/arduino-assessment-starter.ino",
              base + "a29/materials/starter-answers.html",
          ]
          output = Path("qa-assessment")
          output.mkdir(exist_ok=True)
          report = {"source_sha": sha, "tested_live_url": url, "expected_nav_links": 5, "results": [], "status": "RUNNING"}
          source_code = Path("public/downloads/arduino-assessment-starter.ino").read_bytes()
          component = Path("app/arduino-assessment.tsx").read_text(encoding="utf-8")
          
          # Verify the source in this branch and the browser expectations match before accessing the live site.
          assert '<nav aria-label="수행평가 필수 자료"' in component, "Assessment nav accessible name differs"
          source_resources = component.split("const resources = [", 1)[1].split("];", 1)[0]
          source_labels = re.findall(r'label:\s*"([^"]+)"', source_resources)
          assert source_labels == expected, (source_labels, expected)
          
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  for name, width, height in [("desktop", 1440, 1000), ("school-screen", 1280, 800), ("mobile", 390, 844)]:
                      context = browser.new_context(
                          viewport={"width": width, "height": height},
                          accept_downloads=True,
                          extra_http_headers={"Cache-Control": "no-cache"}
                      )
                      page = context.new_page()
                      errors = []
                      page.on("pageerror", lambda error: errors.append(str(error)))
                      links = page.locator('header nav[aria-label="수행평가 필수 자료"] a')
          
                      # The feature branch changes only the automated check; test against actual published main.
                      for attempt in range(3):
                          errors.clear()
                          response = page.goto(url + "&check=" + str(int(time.time())), wait_until="domcontentloaded", timeout=60000)
                          assert response and response.status == 200, "Published assessment page did not return HTTP 200"
                          try:
                              expect(links).to_have_count(5, timeout=20000)
                              break
                          except AssertionError:
                              if attempt == 2:
                                  raise
                              time.sleep(6)
          
                      assert links.all_text_contents() == expected, links.all_text_contents()
                      assert links.count() == 5, "The assessment navigation must contain exactly five learning links"
                      assert page.get_by_role("heading", name="아두이노 수행평가 실습").is_visible()
                      for i, expected_href in enumerate(expected_hrefs):
                          href = links.nth(i).get_attribute("href")
                          actual = href if href.startswith("#") else urljoin(base, href)
                          assert actual == expected_href, (i, actual, expected_href)
                          assert links.nth(i).is_visible(), expected[i]
                      for section in ["videos", "code", "rubric"]:
                          assert page.locator("#" + section).count() == 1, "Missing learning section: " + section
                      assert page.locator('iframe[title="아두이노 수행평가 실습 영상 3편"]').count() == 1
                      assert not errors, errors
                      assert page.evaluate("document.documentElement.scrollWidth <= window.innerWidth + 1"), "Horizontal page overflow"
                      page.screenshot(path=str(output / (name + ".png")), full_page=False)
          
                      # The second top navigation link is an in-page anchor.
                      links.nth(1).click()
                      assert page.url.split("#")[-1] == "videos", page.url
                      assert page.locator("#videos").is_visible()
                      page.screenshot(path=str(output / (name + "-videos.png")), full_page=False)
          
                      # The fourth navigation link must download the exact 12-blank Arduino starter code.
                      with page.expect_download(timeout=30000) as downloaded:
                          links.nth(3).click()
                      download = downloaded.value
                      assert download.failure() is None, download.failure()
                      code = Path(download.path()).read_bytes()
                      assert code == source_code, "Published starter code differs from the reviewed source"
                      markers = re.findall(rb"__\d{2}__", code)
                      assert markers == [f"__{i:02}__".encode() for i in range(1, 13)], markers
                      assert links.nth(3).get_attribute("download") is not None
          
                      # Links 1, 3, 5 must open actual published HTML in new tabs.
                      destinations = []
                      for i in (0, 2, 4):
                          target = expected_hrefs[i]
                          resource = context.request.get(target, timeout=30000)
                          assert resource.status == 200, (target, resource.status)
                          assert "<html" in resource.text().lower(), target
                          with page.expect_popup(timeout=30000) as popup_info:
                              links.nth(i).click()
                          popup = popup_info.value
                          popup.wait_for_load_state("domcontentloaded")
                          assert popup.url.startswith(target), (popup.url, target)
                          destinations.append({"label": expected[i], "url": popup.url, "status": resource.status})
                          popup.close()
                      video_doc = context.request.get(base + "learning-videos/index.html", timeout=30000)
                      assert video_doc.status == 200, ("Video index", video_doc.status)
                      assert "<html" in video_doc.text().lower()
                      assert not errors, errors
          
                      result = {
                          "viewport": name, "width": width, "nav_labels": expected, "nav_count": 5,
                          "javascript_errors": errors, "download_blanks": len(markers),
                          "download_sha256": hashlib.sha256(code).hexdigest(),
                          "external_destinations": destinations, "video_index_http_status": video_doc.status,
                          "status": "PASS",
                      }
                      report["results"].append(result)
                      print(json.dumps(result, ensure_ascii=False), flush=True)
                      context.close()
                  browser.close()
              report["status"] = "PASS"
          except Exception as error:
              report["status"] = "FAIL"
              report["error"] = str(error)
              raise
          finally:
              (output / "report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Assessment five-link navigation: " + report["status"] + "\n\n")
                  summary.write("Test revision: \`" + sha + "\`; target: deployed GitHub Pages\n\n")
                  for result in report["results"]:
                      summary.write("- " + result["viewport"] + ": 5 links, 12 code blanks, HTML destinations, embedded video index and no page errors passed.\n")
                  if "error" in report:
                      summary.write("\nError: " + report["error"] + "\n")
          PY
      - name: Preserve browser check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-navigation-browser-evidence
          path: qa-assessment/
          retention-days: 7

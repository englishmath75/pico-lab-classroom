<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Interactive Galaxy Black Hole</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; cursor: crosshair; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const particles = [];
    const numParticles = 1800;
    let mouse = { x: width / 2, y: height / 2, isDown: false };

    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', () => mouse.isDown = true);
    window.addEventListener('mouseup', () => mouse.isDown = false);
    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
            this.radius = Math.random() * 2 + 0.5;
            this.hue = Math.random() * 360;
        }
        update() {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let dist = Math.hypot(dx, dy);
            
            // 클릭 시 초대질량 블랙홀 중력 발동
            let gravity = (mouse.isDown ? 250 : 70) / (dist + 10);
            let angle = Math.atan2(dy, dx);
            
            // 직교 회전력 + 중심 끌림 중력 알고리즘
            this.vx += Math.cos(angle) * gravity * 0.1 + Math.sin(angle) * gravity * 0.25;
            this.vy += Math.sin(angle) * gravity * 0.1 - Math.cos(angle) * gravity * 0.25;

            this.vx *= 0.96; // 공기 저항 감쇠
            this.vy *= 0.96;
            this.x += this.vx;
            this.y += this.vy;
            this.hue = (this.hue + 0.6) % 360;

            if (dist < 8) this.reset(); // 블랙홀 사건의 지평선 흡수 후 재생성
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `hsl(${this.hue}, 100%, 65%)`;
            ctx.fill();
        }
    }

    for (let i = 0; i < numParticles; i++) particles.push(new Particle());

    function render() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)'; // 광원 잔상 모션블러
        ctx.fillRect(0, 0, width, height);

        // 중심 블랙홀 시각화
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, mouse.isDown ? 20 : 12, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.strokeStyle = mouse.isDown ? '#ff0055' : '#00f0ff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 18;
        ctx.shadowColor = mouse.isDown ? '#ff0055' : '#00f0ff';
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>

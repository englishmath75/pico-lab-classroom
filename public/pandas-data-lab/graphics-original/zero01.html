<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Commercial 3D Wave Graphics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let mouse = { x: width / 2, y: height / 2 };
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    let step = 0;
    function render() {
        ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
        ctx.fillRect(0, 0, width, height);
        
        step += 0.03;
        const rows = 35;
        const cols = 60;
        
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                // 입체감을 위한 삼각함수 좌표 계산
                let x = (i - cols / 2) * 25;
                let z = (j - rows / 2) * 25;
                
                // 마우스 거리에 따른 파동 왜곡 효과
                let dist = Math.hypot(x - (mouse.x - width/2), z - (mouse.y - height/2));
                let wave = Math.sin(step + dist * 0.01) * 40;
                
                // 3D -> 2D 원근 투영 (Perspective Projection)
                let fov = 300;
                let scale = fov / (fov + z + 400);
                let projX = width / 2 + x * scale;
                let projY = height / 2 + (wave + 100) * scale;
                
                // 깊이감 및 다이내믹 컬러링
                let alpha = Math.max(0.1, scale * 0.8);
                let hue = (i * 5 + step * 20) % 360;
                
                ctx.beginPath();
                ctx.arc(projX, projY, Math.max(1, 4 * scale), 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
                ctx.fill();
            }
        }
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>

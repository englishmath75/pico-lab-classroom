<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="STEP 1 · 초음파 + 부저">
<style>
.bg{fill:#f7fafc} .board{fill:#1e88c8;stroke:#0d4f79;stroke-width:3} .bb{fill:#fff;stroke:#cbd5e1;stroke-width:3} .chip{fill:#0f172a} .pin{fill:#e2e8f0} .label{font:700 24px Arial,sans-serif;fill:#102e43} .small{font:600 17px Arial,sans-serif;fill:#475569} .wirelabel{font:700 15px Arial,sans-serif;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round} .hint{font:700 18px Arial,sans-serif;fill:#087f86} .power{fill:#ef4444} .gnd{fill:#111827}
</style>
